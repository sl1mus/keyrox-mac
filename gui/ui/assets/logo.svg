<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="kgRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="100%" stop-color="#ff9500"/>
    </linearGradient>
    <linearGradient id="kgBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e39"/>
      <stop offset="100%" stop-color="#16181f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Base Keyboard Frame -->
  <rect x="4" y="8" width="40" height="32" rx="7" fill="url(#kgBase)" stroke="#3a3f4d" stroke-width="1.5"/>
  <!-- Key Grid Matrix -->
  <!-- Row 1 -->
  <rect x="9" y="14" width="6" height="5" rx="1.5" fill="#4a5060"/>
  <rect x="17" y="14" width="6" height="5" rx="1.5" fill="#4a5060"/>
  <rect x="25" y="14" width="6" height="5" rx="1.5" fill="#4a5060"/>
  <rect x="33" y="14" width="6" height="5" rx="1.5" fill="url(#kgRed)"/>
  <!-- Row 2 -->
  <rect x="9" y="21" width="6" height="5" rx="1.5" fill="#4a5060"/>
  <rect x="17" y="21" width="6" height="5" rx="1.5" fill="url(#kgRed)"/>
  <rect x="25" y="21" width="6" height="5" rx="1.5" fill="#4a5060"/>
  <rect x="33" y="21" width="6" height="5" rx="1.5" fill="#4a5060"/>
  <!-- Row 3 (Spacebar & Mods) -->
  <rect x="9" y="28" width="8" height="5" rx="1.5" fill="#4a5060"/>
  <rect x="19" y="28" width="16" height="5" rx="1.5" fill="url(#kgRed)" filter="url(#glow)"/>
  <rect x="37" y="28" width="4" height="5" rx="1.5" fill="#4a5060"/>
  <!-- Bottom Neon Accent Glow Bar -->
  <line x1="8" y1="36" x2="40" y2="36" stroke="url(#kgRed)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
</svg>
